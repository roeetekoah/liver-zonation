<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Liver zonation: a donor-level computational reanalysis</title>
  <desc id="desc">From 47 donors and 99,809 nuclei, the analysis separates 38 matched biopsy donors, measures raw RNA with eight deterministic thinning draws, and produces traceable results. The matched measurements show no clear progressive collapse but do not establish equivalence at plus or minus 5 or 10 percentage points. A CYP program declines relatively. Endpoint comparisons remain acquisition-confounded.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="8" refX="5" refY="4" orient="auto"><path d="M0,0 L6,4 L0,8" fill="none" stroke="#7897a5" stroke-width="1.4"/></marker>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif}
      .eyebrow{font-size:14px;font-weight:600;letter-spacing:1.8px;fill:#9cd8d7}
      .title{font-size:33px;font-weight:700;fill:#f4f8fa}
      .subtitle{font-size:19px;fill:#b6cbd5}
      .step{font-size:13px;font-weight:600;letter-spacing:1.5px;fill:#9cb8c5}
      .heading{font-size:25px;font-weight:700;fill:#f4f8fa}
      .body{font-size:17px;fill:#d3e1e8}
      .note{font-size:16px;fill:#b5cbd5}
      .finding{font-size:13px;font-weight:600;letter-spacing:1.4px}
    </style>
  </defs>

  <rect width="1200" height="570" rx="20" fill="#10232d"/>
  <text x="48" y="44" class="eyebrow">COMPUTATIONAL REANALYSIS</text>
  <text x="48" y="88" class="title">Liver zonation, tested at the donor level</text>
  <text x="48" y="122" class="subtitle">Match acquisition. Control detection depth. Quantify uncertainty.</text>

  <!-- Workflow: equal-width cards keep the reading order clear at GitHub width. -->
  <rect x="48" y="157" width="344" height="151" rx="12" fill="#193642" stroke="#315462"/>
  <text x="70" y="185" class="step">01 / COHORT</text>
  <text x="70" y="221" class="heading">47 donors</text>
  <text x="70" y="253" class="body">99,809 nuclei in the source cohort</text>
  <text x="70" y="280" class="note">38 donors in the matched biopsy series</text>

  <path d="M400 232 H416" stroke="#7897a5" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="428" y="157" width="344" height="151" rx="12" fill="#193642" stroke="#315462"/>
  <text x="450" y="185" class="step">02 / MEASUREMENT</text>
  <text x="450" y="221" class="heading">Raw RNA → donor</text>
  <text x="450" y="253" class="body">Eight deterministic thinning draws</text>
  <text x="450" y="280" class="note">Donor metrics · DGE · gene-set tests</text>

  <path d="M780 232 H796" stroke="#7897a5" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="808" y="157" width="344" height="151" rx="12" fill="#193642" stroke="#315462"/>
  <text x="830" y="185" class="step">03 / VERIFICATION</text>
  <text x="830" y="221" class="heading">Traceable results</text>
  <text x="830" y="253" class="body">Fresh outputs, logs, and input hashes</text>
  <text x="830" y="280" class="note">Estimates with explicit uncertainty</text>

  <!-- Each finding pairs a concise result with its interpretive boundary. -->
  <rect x="48" y="342" width="344" height="184" rx="12" fill="#142f39" stroke="#315462"/>
  <path d="M70 363 H96" stroke="#9cd8d7" stroke-width="3" stroke-linecap="round"/>
  <text x="70" y="389" class="finding" fill="#9cd8d7">MATCHED BIOPSIES</text>
  <text x="70" y="422" class="heading">No clear progressive</text>
  <text x="70" y="451" class="heading">collapse</text>
  <text x="70" y="483" class="note">Wide intervals still allow shifts</text>
  <text x="70" y="507" class="note">±5 / ±10 pp equivalence not shown</text>

  <rect x="428" y="342" width="344" height="184" rx="12" fill="#142f39" stroke="#315462"/>
  <path d="M450 363 H476" stroke="#f0a66c" stroke-width="3" stroke-linecap="round"/>
  <text x="450" y="389" class="finding" fill="#f0a66c">CYP PROGRAM</text>
  <text x="450" y="422" class="heading">Relative CYP</text>
  <text x="450" y="451" class="heading">program decline</text>
  <text x="450" y="483" class="note">Gene-set and within-PC evidence</text>
  <text x="450" y="507" class="note">RNA programs, not enzyme activity</text>

  <rect x="808" y="342" width="344" height="184" rx="12" fill="#142f39" stroke="#315462"/>
  <path d="M830 363 H856" stroke="#c0a5e2" stroke-width="3" stroke-linecap="round"/>
  <text x="830" y="389" class="finding" fill="#c0a5e2">ENDPOINT COMPARISONS</text>
  <text x="830" y="422" class="heading">Acquisition-confounded</text>
  <text x="830" y="451" class="heading">endpoints</text>
  <text x="830" y="483" class="note">Organ tissue versus needle biopsy</text>
  <text x="830" y="507" class="note">Disease and acquisition inseparable</text>
</svg>
